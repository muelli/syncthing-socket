name: Bootstrap signing identity

# Mints the certificate for one signing role and opens a pull request adding it to
# signing/. Run once per role, ever.
#
# The key is derived inside the job from MASTER_SECRET, so the seed never leaves the
# repository secret store and no private key is ever written to the repository.

on:
  workflow_dispatch:
    inputs:
      role:
        description: 'Signing role to bootstrap'
        required: true
        type: choice
        options: [app, fdroid, debian]
      confirm_rotation:
        description: 'Replace an existing certificate (identity reset, breaks every install)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  bootstrap:
    name: Bootstrap ${{ inputs.role }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Refuse to silently rotate
        run: |
          # The debian role pins an armoured OpenPGP public key; the others pin an X.509
          # certificate.
          if [ "${{ inputs.role }}" = "debian" ]; then
            PINNED="signing/debian-pub.asc"
          else
            PINNED="signing/${{ inputs.role }}-cert.pem"
          fi
          echo "PINNED=$PINNED" >> "$GITHUB_ENV"
          if [ -f "$PINNED" ] && [ "${{ inputs.confirm_rotation }}" != "true" ]; then
            echo "$PINNED already exists." >&2
            echo "Re-bootstrapping mints a different certificate, which is an identity reset:" >&2
            echo "every user must uninstall the app and remove and re-add the repository." >&2
            echo "Re-run with confirm_rotation if that is genuinely what you want." >&2
            exit 1
          fi

      - name: Mint the certificate
        env:
          MASTER_SECRET: ${{ secrets.MASTER_SECRET }}
        run: |
          if [ -z "$MASTER_SECRET" ]; then
            echo "MASTER_SECRET is not set; there is nothing to derive from." >&2
            exit 1
          fi
          go run ./scripts -bootstrap "$MASTER_SECRET" "${{ inputs.role }}" >/dev/null
          # Private key material is an artefact of this job and must never be committed.
          rm -f key_*.pem cert_*.pem secret_*.asc pub_*.asc
          if [ "${{ inputs.role }}" = "debian" ]; then
            gpg --show-keys --with-fingerprint "$PINNED"
          else
            openssl x509 -in "$PINNED" -noout -subject -dates -fingerprint -sha256
          fi

      - name: Open a pull request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          add-paths: signing/
          branch: bootstrap-signing-${{ inputs.role }}
          commit-message: |
            signing: pin the ${{ inputs.role }} certificate

            Minted once from MASTER_SECRET. This certificate is the identity for this
            role: Android compares certificate bytes to authorise an update, and an
            F-Droid repository fingerprint is the SHA-256 of the index-signing
            certificate. It cannot be re-derived, so it is pinned here and
            scripts/generate_keystore.go verifies the seed against it before signing.
          title: 'signing: pin the ${{ inputs.role }} certificate'
          body: |
            Minted by the `Bootstrap signing identity` workflow from `MASTER_SECRET`.

            Only the public certificate is added; the private key stays derivable from the
            seed and was deleted with the job.

            Check the fingerprint in the job log against the file before merging.
