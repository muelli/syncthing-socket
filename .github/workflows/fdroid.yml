name: Deploy F-Droid Repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver

      - name: Download Release APKs
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          file: '.*\.apk$'
          regex: true
          target: 'repo/'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup F-Droid Keystore
        env:
          MASTER_SECRET: ${{ secrets.MASTER_SECRET }}
        run: |
          mkdir -p fdroid
          if [ -n "$MASTER_SECRET" ]; then
            go run scripts/generate_keystore.go "$MASTER_SECRET" fdroid
            openssl pkcs12 -export -out fdroid/keystore.p12 -inkey key_fdroid.pem -in cert_fdroid.pem -passout pass:syncthing -name fdroid
            rm key_fdroid.pem cert_fdroid.pem
          else
            echo "Warning: MASTER_SECRET is not set. Generating temporary keystore."
            keytool -genkey -v -keystore fdroid/keystore.p12 -storetype PKCS12 -alias fdroid -keyalg RSA -keysize 4096 -validity 10000 -storepass syncthing -keypass syncthing -dname "CN=Syncthing LUKS, OU=F-Droid, O=muelli, C=US"
          fi

      - name: Initialize and Update F-Droid Repo
        run: |
          cd fdroid
          cat <<EOF > config.yml
          repo_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/fdroid/repo
          repo_name: Syncthing LUKS F-Droid Repository
          repo_icon: icon.png
          repo_description: Official F-Droid repository for the Syncthing LUKS Unlocker app.
          keystore: keystore.p12
          keystorepass: syncthing
          keypass: syncthing
          keydname: "CN=Syncthing LUKS fdroid, O=Syncthing LUKS"
          EOF
          
          # Ensure repo dir exists and copy downloaded APKs
          mkdir -p repo
          cp -r ../repo/*.apk repo/ 2>/dev/null || echo "No APKs found to copy."
          
          # Run fdroid update to scan APKs and generate index
          fdroid update -c
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid
          keep_files: false
