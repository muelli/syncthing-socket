name: Deploy F-Droid Repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y qrencode
          pip install --break-system-packages fdroidserver

      - name: Download Release APKs
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          file: '.*\.apk$'
          regex: true
          target: 'repo/'
          token: ${{ secrets.GITHUB_TOKEN }}

      # No fallback keystore. The repository fingerprint is the SHA-256 of this
      # certificate and clients pin it when the repository is added, so signing the index
      # with a throwaway key silently orphans every existing user.
      - name: Setup F-Droid Keystore
        env:
          MASTER_SECRET: ${{ secrets.MASTER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${MASTER_SECRET:-}" ]; then
            echo "MASTER_SECRET is not set; refusing to sign the index with a throwaway key." >&2
            exit 1
          fi
          mkdir -p fdroid
          KS_PASS=$(go run ./scripts "$MASTER_SECRET" fdroid)
          echo "::add-mask::$KS_PASS"
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          openssl pkcs12 -export -out fdroid/keystore.p12 -inkey key_fdroid.pem -in cert_fdroid.pem \
            -passout "pass:$KS_PASS" -name fdroid
          rm -f key_fdroid.pem cert_fdroid.pem

      - name: Initialize and Update F-Droid Repo
        run: |
          cd fdroid
          cat <<EOF > config.yml
          repo_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo
          repo_name: Syncthing LUKS F-Droid Repository
          repo_icon: icon.png
          repo_description: Official F-Droid repository for the Syncthing LUKS Unlocker app.
          keystore: keystore.p12
          repo_keyalias: fdroid
          keystorepass: "${KS_PASS}"
          keypass: "${KS_PASS}"
          keydname: "CN=Syncthing LUKS fdroid, O=Syncthing LUKS"
          EOF
          
          # Ensure repo dir exists and copy downloaded APKs
          mkdir -p repo
          cp -r ../repo/*.apk repo/ 2>/dev/null || echo "No APKs found to copy."
          cp ../assets/logo.png icon.png 2>/dev/null || echo "Logo not found."
          
          # Run fdroid update to scan APKs and generate index
          fdroid update -c
          
          # Compute the repo fingerprint for the landing page / add-repo link.
          FP="$(keytool -list -v -keystore keystore.p12 -storepass "$KS_PASS" -alias fdroid \
                | awk -F': ' '/SHA256:/{gsub(/:/,"",$2); print tolower($2); exit}')"
          REPO_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo"
          ADD_URL="${REPO_URL}?fingerprint=${FP}"
          touch .nojekyll

          # QR code that F-Droid's "Add repository" scanner understands.
          qrencode -o qr.png -s 8 -m 2 "$ADD_URL"

          # Landing page: rendered from the committed template
          if [ -f landing.html ]; then
            sed -e "s|{{REPO_URL}}|${REPO_URL}|g" -e "s|{{FINGERPRINT}}|${FP}|g" \
                landing.html > index.html
          fi
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './fdroid'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
