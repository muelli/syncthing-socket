name: Build and Upload Artifacts

on:
  push:
    branches: [ "*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cli:
              - 'cmd/**'
              - 'client/**'
              - 'server/**'
              - '*.go'
              - 'go.mod'
              - 'go.sum'
              - 'scripts/**'
              - 'Justfile'
            android:
              - 'android/**'
              - 'mobile/**'
              - '*.go'
              - 'go.mod'
              - 'go.sum'

  build-cli:
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' || startsWith(github.ref, 'refs/tags/') }}
    name: Build CLI Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Run Tests
        run: |
          go test -v ./...
          rm -f test-*

      - name: Build Binaries
        run: |
          mkdir -p dist
          VERSION=$(sh scripts/version.sh)
          LDFLAGS="-s -w -X syncthing-socket.Version=$VERSION"
          export CGO_ENABLED=0
          
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/syncthing-socket-linux-amd64 ./cmd/syncthing-socket
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/syncthing-socket-darwin-amd64 ./cmd/syncthing-socket
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/syncthing-socket-darwin-arm64 ./cmd/syncthing-socket
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/syncthing-socket-windows-amd64.exe ./cmd/syncthing-socket

          echo "$VERSION" > VERSION
          tar --exclude='./dist' --exclude='./.git' --exclude='./local' --exclude='./test-*' --exclude='./.venv' --exclude='./.agents' -czf dist/syncthing-socket-source-$VERSION.tar.gz .
          rm VERSION

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: dist/syncthing-socket-sbom.spdx.json
          format: spdx-json

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*'

      - name: Attest SBOM
        uses: actions/attest-sbom@v1
        with:
          subject-path: 'dist/*'
          sbom-path: 'dist/syncthing-socket-sbom.spdx.json'

      - name: Upload CLI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syncthing-socket-binaries
          path: dist/*
          retention-days: 7

  build-android:
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' || startsWith(github.ref, 'refs/tags/') }}
    name: Build Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android APK
        working-directory: android
        run: |
          rm -rf ../vendor
          gradle assembleRelease

      # No fallback key. Signing with a throwaway keystore when the secret is missing
      # publishes an APK that no user can upgrade across and that nobody can reproduce,
      # which is worse than not publishing at all.
      - name: Sign Android APK
        env:
          MASTER_SECRET: ${{ secrets.MASTER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${MASTER_SECRET:-}" ]; then
            echo "MASTER_SECRET is not set; refusing to sign with a throwaway key." >&2
            exit 1
          fi
          REPO_ROOT=$PWD
          cd android/app/build/outputs/apk/release
          BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)

          # Verifies the seed against signing/app-cert.pem and fails if they disagree.
          # Prints only the derived keystore passphrase on stdout.
          KS_PASS=$(cd "$REPO_ROOT" && go run ./scripts "$MASTER_SECRET" app)
          echo "::add-mask::$KS_PASS"
          mv "$REPO_ROOT"/key_app.pem "$REPO_ROOT"/cert_app.pem .

          openssl pkcs12 -export -out keystore.p12 -inkey key_app.pem -in cert_app.pem \
            -passout "pass:$KS_PASS" -name release
          $BUILD_TOOLS/zipalign -v -p 4 app-release-unsigned.apk app-release-aligned.apk
          # --alignment-preserved keeps the zip layout so apksigcopier and F-Droid's
          # verifier can reproduce the signed APK from an unsigned reproducible build.
          $BUILD_TOOLS/apksigner sign --ks keystore.p12 --ks-pass "pass:$KS_PASS" \
            --ks-key-alias release --key-pass "pass:$KS_PASS" --alignment-preserved \
            --out syncthing-socket.apk app-release-aligned.apk
          rm -f keystore.p12 key_app.pem cert_app.pem app-release-unsigned.apk app-release-aligned.apk

          # The signer must be the pinned identity, or this release is effectively a
          # different app and no existing install can upgrade to it.
          EXPECTED=$(openssl x509 -in "$REPO_ROOT/signing/app-cert.pem" -outform DER | sha256sum | cut -d' ' -f1)
          ACTUAL=$($BUILD_TOOLS/apksigner verify --print-certs syncthing-socket.apk \
            | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1)
          echo "pinned: $EXPECTED"
          echo "actual: $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "The signed APK does not carry the pinned certificate." >&2
            exit 1
          fi

      - name: Verify F-Droid Freedom
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip install --break-system-packages fdroidserver
          cd android/app/build/outputs/apk/release
          fdroid scanner --exit-code syncthing-socket.apk

      - name: Generate Android SBOM
        uses: anchore/sbom-action@v0
        with:
          path: android/
          output-file: android/app/build/outputs/apk/release/syncthing-socket-android-sbom.spdx.json
          format: spdx-json

      - name: Attest Android Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'android/app/build/outputs/apk/release/*.apk'

      - name: Attest Android SBOM
        uses: actions/attest-sbom@v1
        with:
          subject-path: 'android/app/build/outputs/apk/release/*.apk'
          sbom-path: 'android/app/build/outputs/apk/release/syncthing-socket-android-sbom.spdx.json'

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syncthing-socket-android
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

  release:
    needs: [build-cli, build-android]
    if: always() && startsWith(github.ref, 'refs/tags/')
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten Artifacts
        run: |
          mkdir -p release-assets
          find dist -type f -exec mv {} release-assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
