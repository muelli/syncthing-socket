name: Build and Upload Artifacts

on:
  push:
    branches: [ "*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            cli:
              - 'cmd/**'
              - 'client/**'
              - 'server/**'
              - '*.go'
              - 'go.mod'
              - 'go.sum'
              - 'scripts/**'
              - 'Justfile'
              - 'debian/**'
              - 'contrib/**'
              - '.github/workflows/build.yml'
            android:
              - 'android/**'
              - 'mobile/**'
              - '*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/build.yml'

  build-cli:
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' || startsWith(github.ref, 'refs/tags/') }}
    name: Build CLI Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.0'
          cache: true

      - name: Run Tests
        run: |
          go test -v ./...
          rm -f test-*

      - name: Build Binaries
        run: |
          mkdir -p dist
          VERSION=$(sh scripts/version.sh)
          LDFLAGS="-s -w -X syncthing-socket.Version=$VERSION"
          export CGO_ENABLED=0
          
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/syncthing-socket-linux-amd64 ./cmd/syncthing-socket
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/syncthing-socket-linux-arm64 ./cmd/syncthing-socket
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/syncthing-socket-darwin-amd64 ./cmd/syncthing-socket
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/syncthing-socket-darwin-arm64 ./cmd/syncthing-socket
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/syncthing-socket-windows-amd64.exe ./cmd/syncthing-socket

          echo "$VERSION" > VERSION
          tar --exclude='./dist' --exclude='./.git' --exclude='./local' --exclude='./test-*' --exclude='./.venv' --exclude='./.agents' -czf dist/syncthing-socket-source-$VERSION.tar.gz .
          rm VERSION

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          output-file: dist/syncthing-socket-sbom.spdx.json
          format: spdx-json

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: 'dist/*'

      - name: Attest SBOM
        uses: actions/attest-sbom@5026d3663739160db546203eeaffa6aa1c51a4d6 # v1.4.1
        with:
          subject-path: 'dist/*'
          sbom-path: 'dist/syncthing-socket-sbom.spdx.json'

      - name: Upload CLI Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: syncthing-socket-binaries
          path: dist/*
          retention-days: 7

  build-deb:
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' || startsWith(github.ref, 'refs/tags/') }}
    name: Build Debian Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.0'
          cache: true

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debhelper dpkg-dev fakeroot

      - name: Generate debian/changelog from the tag
        run: |
          set -euo pipefail
          # Tags are v<commit-count>. Debian needs a version that sorts monotonically and
          # leaves room for a later 0.1.0, so v122 becomes 0.0.122-1. A committed
          # changelog would go stale the moment anything is tagged.
          RAW=$(sh scripts/version.sh)
          COUNT=${RAW#v}
          COUNT=${COUNT%-dirty}
          DEB_VERSION="0.0.${COUNT}-1"
          echo "DEB_VERSION=$DEB_VERSION" >> "$GITHUB_ENV"
          cat > debian/changelog <<EOF
          syncthing-socket ($DEB_VERSION) unstable; urgency=medium

            * Build from ${GITHUB_SHA}.

           -- syncthing-socket CI <noreply@github.com>  $(date -R)
          EOF
          head -1 debian/changelog

      - name: Build packages
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            echo "::group::$arch"
            # -d because Build-Depends names no toolchain: setup-go provides it, and the
            # distro's golang-go is too old for go.mod in any case.
            dpkg-buildpackage -us -uc -b -d --host-arch "$arch"
            echo "::endgroup::"
          done
          mv ../*.deb dist/
          ls -la dist/

      - name: Verify the packages
        run: |
          set -euo pipefail
          # The arm64 package is cross-built, so confirm it really is arm64 rather than a
          # host binary with the wrong label.
          dpkg-deb -x dist/syncthing-socket_*_arm64.deb /tmp/arm64
          file /tmp/arm64/usr/bin/syncthing-socket | tee /tmp/arch.txt
          grep -q 'ARM aarch64' /tmp/arch.txt
          dpkg-deb -x dist/syncthing-socket_*_amd64.deb /tmp/amd64
          file /tmp/amd64/usr/bin/syncthing-socket | grep -q 'x86-64'
          # The initramfs package is what the LUKS unlock depends on; make sure the
          # scripts are actually in it.
          dpkg-deb -c dist/syncthing-socket-luks-initramfs_*_all.deb \
            | grep -q 'scripts/local-top/syncthing-socket'

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: 'dist/*.deb'

      - name: Upload Debian Packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: syncthing-socket-debs
          path: dist/*.deb
          retention-days: 7

  build-android:
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' || startsWith(github.ref, 'refs/tags/') }}
    name: Build Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.0'
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      # Uses the committed wrapper (android/gradlew), pinned in
      # gradle/wrapper/gradle-wrapper.properties, instead of a
      # separately-versioned system Gradle, so the build tool itself is
      # part of the reproducible, pinned input set.
      - name: Build Android APK
        working-directory: android
        run: |
          set -euo pipefail
          # Compute the version before deleting vendor/. gomobile bind cannot run with a
          # vendor directory present, but removing it dirties the working tree, and
          # version.sh would then report "-dirty", which is how v136 shipped labelled
          # "v136-dirty". version.sh honours $VERSION when set.
          VERSION=$(sh ../scripts/version.sh)
          export VERSION
          echo "building Android versionName: $VERSION"
          rm -rf ../vendor
          ./gradlew assembleRelease

      # No fallback key. Signing with a throwaway keystore when the secret is missing
      # publishes an APK that no user can upgrade across and that nobody can reproduce,
      # which is worse than not publishing at all.
      - name: Sign Android APK
        env:
          MASTER_SECRET: ${{ secrets.MASTER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${MASTER_SECRET:-}" ]; then
            echo "MASTER_SECRET is not set; refusing to sign with a throwaway key." >&2
            exit 1
          fi
          REPO_ROOT=$PWD
          cd android/app/build/outputs/apk/release
          BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)

          # Verifies the seed against signing/app-cert.pem and fails if they disagree.
          # Prints only the derived keystore passphrase on stdout.
          KS_PASS=$(cd "$REPO_ROOT" && go run ./scripts "$MASTER_SECRET" app)
          echo "::add-mask::$KS_PASS"
          mv "$REPO_ROOT"/key_app.pem "$REPO_ROOT"/cert_app.pem .

          openssl pkcs12 -export -out keystore.p12 -inkey key_app.pem -in cert_app.pem \
            -passout "pass:$KS_PASS" -name release
          $BUILD_TOOLS/zipalign -v -p 4 app-release-unsigned.apk app-release-aligned.apk
          # --alignment-preserved keeps the zip layout so apksigcopier and F-Droid's
          # verifier can reproduce the signed APK from an unsigned reproducible build.
          $BUILD_TOOLS/apksigner sign --ks keystore.p12 --ks-pass "pass:$KS_PASS" \
            --ks-key-alias release --key-pass "pass:$KS_PASS" --alignment-preserved \
            --out syncthing-socket.apk app-release-aligned.apk
          rm -f keystore.p12 key_app.pem cert_app.pem app-release-unsigned.apk app-release-aligned.apk

          # The signer must be the pinned identity, or this release is effectively a
          # different app and no existing install can upgrade to it.
          EXPECTED=$(openssl x509 -in "$REPO_ROOT/signing/app-cert.pem" -outform DER | sha256sum | cut -d' ' -f1)
          ACTUAL=$($BUILD_TOOLS/apksigner verify --print-certs syncthing-socket.apk \
            | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1)
          echo "pinned: $EXPECTED"
          echo "actual: $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "The signed APK does not carry the pinned certificate." >&2
            exit 1
          fi

      - name: Verify F-Droid Freedom
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip install --break-system-packages fdroidserver
          cd android/app/build/outputs/apk/release
          fdroid scanner --exit-code syncthing-socket.apk

      - name: Generate Android SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: android/
          output-file: android/app/build/outputs/apk/release/syncthing-socket-android-sbom.spdx.json
          format: spdx-json

      - name: Attest Android Build Provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: 'android/app/build/outputs/apk/release/*.apk'

      - name: Attest Android SBOM
        uses: actions/attest-sbom@5026d3663739160db546203eeaffa6aa1c51a4d6 # v1.4.1
        with:
          subject-path: 'android/app/build/outputs/apk/release/*.apk'
          sbom-path: 'android/app/build/outputs/apk/release/syncthing-socket-android-sbom.spdx.json'

      # The SBOM is generated and attested above but was previously never
      # published anywhere; include it so a downstream consumer (or the
      # release job) can actually get at it, not just its attestation.
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: syncthing-socket-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/syncthing-socket-android-sbom.spdx.json
          retention-days: 7

  release:
    needs: [build-cli, build-deb, build-android]
    # Deliberately not `always()`. A release is the input to both distribution
    # channels, so publishing one assembled from whatever happened to succeed would
    # ship a partial or stale set to users' apt and F-Droid clients.
    if: startsWith(github.ref, 'refs/tags/')
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/

      - name: Flatten Artifacts
        run: |
          mkdir -p release-assets
          find dist -type f -exec mv {} release-assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release-assets/*
          generate_release_notes: true
