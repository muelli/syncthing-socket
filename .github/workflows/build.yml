name: Build and Upload Artifacts

on:
  push:
    branches: [ "*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Tests
        run: |
          go test -v ./...
          rm -f test-*

      - name: Build Binaries
        run: |
          mkdir -p dist
          VERSION=$(sh scripts/version.sh)
          LDFLAGS="-s -w -X main.Version=$VERSION"
          export CGO_ENABLED=0
          
          # Build for Linux (AMD64)
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/syncthing-socket-linux-amd64 .
          
          # Build for macOS (Intel)
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/syncthing-socket-darwin-amd64 .
          
          # Build for macOS (Apple Silicon M1/M2/M3)
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/syncthing-socket-darwin-arm64 .
          
          # Build for Windows (AMD64)
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/syncthing-socket-windows-amd64.exe .

          # Create official source tarball containing the VERSION file for OS packagers
          echo "$VERSION" > VERSION
          tar --exclude='./dist' --exclude='./.git' --exclude='./local' --exclude='./test-*' --exclude='./.venv' --exclude='./.agents' -czf dist/syncthing-socket-source-$VERSION.tar.gz .
          rm VERSION

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          file: dist/syncthing-socket-sbom.spdx.json
          format: spdx-json

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*'

      - name: Attest SBOM
        uses: actions/attest-sbom@v1
        with:
          subject-path: 'dist/*'
          sbom-path: 'dist/syncthing-socket-sbom.spdx.json'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syncthing-socket-binaries
          path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
