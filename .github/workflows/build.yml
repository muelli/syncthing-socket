name: Build and Upload Artifacts

on:
  push:
    branches: [ "*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cli:
              - 'cmd/**'
              - 'client/**'
              - 'server/**'
              - '*.go'
              - 'go.mod'
              - 'go.sum'
              - 'scripts/**'
              - 'Justfile'
            android:
              - 'android/**'
              - 'mobile/**'
              - '*.go'
              - 'go.mod'
              - 'go.sum'

  build-cli:
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' || startsWith(github.ref, 'refs/tags/') }}
    name: Build CLI Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Run Tests
        run: |
          go test -v ./...
          rm -f test-*

      - name: Build Binaries
        run: |
          mkdir -p dist
          VERSION=$(sh scripts/version.sh)
          LDFLAGS="-s -w -X main.Version=$VERSION"
          export CGO_ENABLED=0
          
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/syncthing-socket-linux-amd64 ./cmd/syncthing-socket
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/syncthing-socket-darwin-amd64 ./cmd/syncthing-socket
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/syncthing-socket-darwin-arm64 ./cmd/syncthing-socket
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/syncthing-socket-windows-amd64.exe ./cmd/syncthing-socket

          echo "$VERSION" > VERSION
          tar --exclude='./dist' --exclude='./.git' --exclude='./local' --exclude='./test-*' --exclude='./.venv' --exclude='./.agents' -czf dist/syncthing-socket-source-$VERSION.tar.gz .
          rm VERSION

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: dist/syncthing-socket-sbom.spdx.json
          format: spdx-json

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*'

      - name: Attest SBOM
        uses: actions/attest-sbom@v1
        with:
          subject-path: 'dist/*'
          sbom-path: 'dist/syncthing-socket-sbom.spdx.json'

      - name: Upload CLI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syncthing-socket-binaries
          path: dist/*
          retention-days: 7

  build-android:
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' || startsWith(github.ref, 'refs/tags/') }}
    name: Build Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android APK
        working-directory: android
        run: |
          rm -rf ../vendor
          gradle assembleRelease

      - name: Sign Android APK
        env:
          MASTER_SECRET: ${{ secrets.MASTER_SECRET }}
        run: |
          cd android/app/build/outputs/apk/release
          BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          if [ -n "$MASTER_SECRET" ]; then
            go run ../../../../../../scripts/generate_keystore.go "$MASTER_SECRET" app
            openssl pkcs12 -export -out keystore.p12 -inkey key_app.pem -in cert_app.pem -passout pass:syncthing -name release
            $BUILD_TOOLS/zipalign -v -p 4 app-release-unsigned.apk app-release-aligned.apk
            $BUILD_TOOLS/apksigner sign --ks keystore.p12 --ks-pass pass:syncthing --ks-key-alias release --key-pass pass:syncthing --out syncthing-socket.apk app-release-aligned.apk
            rm keystore.p12 key_app.pem cert_app.pem app-release-unsigned.apk app-release-aligned.apk
          else
            echo "Warning: MASTER_SECRET is not set. Generating a temporary keystore."
            keytool -genkey -v -keystore keystore.jks -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass syncthing -keypass syncthing -dname "CN=Syncthing LUKS, OU=App, O=muelli, C=US"
            $BUILD_TOOLS/zipalign -v -p 4 app-release-unsigned.apk app-release-aligned.apk
            $BUILD_TOOLS/apksigner sign --ks keystore.jks --ks-pass pass:syncthing --ks-key-alias release --key-pass pass:syncthing --out syncthing-socket.apk app-release-aligned.apk
            rm keystore.jks app-release-unsigned.apk app-release-aligned.apk
          fi

      - name: Generate Android SBOM
        uses: anchore/sbom-action@v0
        with:
          path: android/
          output-file: android/app/build/outputs/apk/release/syncthing-socket-android-sbom.spdx.json
          format: spdx-json

      - name: Attest Android Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'android/app/build/outputs/apk/release/*.apk'

      - name: Attest Android SBOM
        uses: actions/attest-sbom@v1
        with:
          subject-path: 'android/app/build/outputs/apk/release/*.apk'
          sbom-path: 'android/app/build/outputs/apk/release/syncthing-socket-android-sbom.spdx.json'

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syncthing-socket-android
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

  release:
    needs: [build-cli, build-android]
    if: always() && startsWith(github.ref, 'refs/tags/')
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten Artifacts
        run: |
          mkdir -p release-assets
          find dist -type f -exec mv {} release-assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
